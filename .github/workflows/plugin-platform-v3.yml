name: Plugin platform v3 baseline

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: CI scope and validation guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tooling: ${{ steps.scope.outputs.tooling }}
      platform: ${{ steps.scope.outputs.platform }}
      frontend: ${{ steps.scope.outputs.frontend }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI selection and instrumentation guards
        run: python3 -B -m unittest discover -s tools/ci/tests -v
      - name: Test availability monitor
        run: python3 -B -m unittest discover -s deploy/monitoring/tests -v
      - name: Select affected modules
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/classify_changes.py

  tooling-build:
    name: Contract tooling build and unit checks
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin-tooling/package-lock.json
      - name: Install tooling dependencies
        working-directory: plugin-tooling
        run: npm ci
      - name: Check contracts, types, unit tests and determinism with one build
        working-directory: plugin-tooling
        run: npm run check:ci
      - name: Share compiled tooling with browser smoke
        uses: actions/upload-artifact@v4
        with:
          name: plugin-tooling-dist
          path: |
            plugin-tooling/packages/plugin-sdk/dist
            plugin-tooling/packages/plugin-cli/dist
            plugin-tooling/packages/create-bjtu-plugin/dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify shared schemas are byte-identical
        run: |
          cmp docs/third-party-service-manifest.schema.json web/assets/schemas/third-party-service-manifest.schema.json
          cmp docs/bjtu-marketplace.schema.json web/assets/schemas/bjtu-marketplace.schema.json
      - name: Lint contract_v1 source fixtures
        run: |
          node tools/third-party-service-lint.cjs plugin-tooling/packages/plugin-cli/template --source --marketplace --dev
          node tools/third-party-service-lint.cjs third-party-plugins/templates/basic --source --marketplace
          node tools/third-party-service-lint.cjs third-party-plugins/examples/profile-timetable --source --marketplace
          node tools/third-party-service-lint.cjs third-party-plugins/examples/remote-origin-demo --source --marketplace

  browser-smoke:
    name: Real browser protocol v2 smoke
    needs: [changes, tooling-build]
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin-tooling/package-lock.json
      - run: npm ci
        working-directory: plugin-tooling
      - uses: actions/download-artifact@v4
        with:
          name: plugin-tooling-dist
          path: plugin-tooling/packages
      - name: Verify browser and run smoke
        working-directory: plugin-tooling
        env:
          BJTU_PLUGIN_TEST_BROWSER: /usr/bin/google-chrome
        run: |
          "$BJTU_PLUGIN_TEST_BROWSER" --version
          npm run test:browser:built

  frontend:
    name: Open WebUI frontend tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/open-webui/package-lock.json
      - run: npm ci
        working-directory: android/open-webui
      - name: Prepare SvelteKit and run Vitest
        working-directory: android/open-webui
        run: |
          npx svelte-kit sync
          npm run test:frontend -- --run

  platform:
    name: Node 22 platform, schema, integration and e2e
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bjtu_plugins
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: bjtu_plugins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bjtu_plugins -d bjtu_plugins_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bjtu_plugins:test-password@127.0.0.1:5432/bjtu_plugins_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/platform/package-lock.json
      - name: Install platform dependencies
        working-directory: web/platform
        run: npm ci
      - name: Compile once and run unit, PostgreSQL and API e2e tests
        working-directory: web/platform
        run: npm run check:ci
      - name: Check production image contract inputs
        run: |
          test -f docs/third-party-service-manifest.schema.json
          test -f docs/bjtu-marketplace.schema.json
          test -f plugin-tooling/contracts/capability-contracts.json
          test -f tools/third-party-service-lint.cjs
      - name: Verify production image contract inputs
        run: |
          docker build -f web/platform/Dockerfile -t bjtu-plugin-platform-ci .
          docker run --rm --entrypoint node bjtu-plugin-platform-ci -e '
            const lint = require("/repo/tools/third-party-service-lint.cjs");
            const result = { errors: [], warnings: [] };
            const schema = lint.loadManifestSchema("/repo", result);
            if (!schema || result.errors.length || schema.packageLimits.files <= 0) {
              throw new Error(result.errors.join("\n") || "contract package limits are invalid");
            }
          '
  android-jvm:
    name: Android JVM baseline
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Kotlin isolation and APK asset dependencies
        working-directory: android
        run: |
          ./gradlew test :app:compileDebugAndroidTestKotlin :app:compileReleaseKotlin --dry-run --console=plain > "$RUNNER_TEMP/android-compile-tasks.txt"
          python3 ../tools/ci/check_gradle_tasks.py compile "$RUNNER_TEMP/android-compile-tasks.txt"
          ./gradlew assembleDebug --dry-run --console=plain > "$RUNNER_TEMP/android-package-tasks.txt"
          python3 ../tools/ci/check_gradle_tasks.py package "$RUNNER_TEMP/android-package-tasks.txt"
      - name: Run Android JVM tests
        working-directory: android
        run: ./gradlew test
      - name: Compile WebView instrumentation and release runtime
        working-directory: android
        run: ./gradlew :app:compileDebugAndroidTestKotlin :app:compileReleaseKotlin

  android-instrumentation:
    name: Android WebView instrumentation API ${{ matrix.api-level }}
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
        include:
          - api-level: 26
            image-target: default
          - api-level: 35
            image-target: google_apis
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/open-webui/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache pinned API 26 WebView inputs
        if: matrix.api-level == 26
        uses: actions/cache@v4
        with:
          path: runtime/ci-webview
          key: api26-webview-b76f0b24f2f3f90d-a40da80a59d170ca
      - name: Verify pinned API 26 WebView inputs
        if: matrix.api-level == 26
        run: python3 tools/ci/prepare_webview.py fetch runtime/ci-webview
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run WebView security instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.image-target }}
          arch: x86_64
          profile: pixel_2
          disk-size: ${{ matrix.api-level == 26 && '4096M' || '' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            if [ '${{ matrix.api-level }}' = '26' ]; then python3 tools/ci/prepare_webview.py install runtime/ci-webview; fi
            adb shell dumpsys webviewupdate
            cd android && ./gradlew :app:connectedDebugAndroidTest -PtargetAbis=x86_64
      - name: Require security tests to execute and pass
        if: ${{ always() }}
        run: python3 tools/ci/check_instrumentation.py android/app/build/outputs/androidTest-results/connected
      - name: Upload Android instrumentation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}-diagnostics
          path: |
            android/app/build/outputs/androidTest-results
            android/app/build/reports/androidTests
          if-no-files-found: ignore

  # Preserve the existing required-check context, including browser smoke failures.
  tooling:
    name: Contract generation, SDK, CLI and package determinism
    needs: [changes, tooling-build, browser-smoke, frontend, platform, android-jvm, android-instrumentation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci/classify_changes.py --verify-jobs
